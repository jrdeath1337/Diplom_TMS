apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-svc
spec:
  selector:
    app: hybrid-api
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8888
  type: {{ .Values.service.type }}

metadata:
  name: {{ .Release.Name }}-svc
  labels:
    app: hybrid-api
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8888"
    prometheus.io/path: "/metrics"
